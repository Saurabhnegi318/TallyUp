server:
  port: 8081
  tomcat:
    threads:
      max: 20

spring:
  application:
    name: group-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${GROUP_DB_NAME:group_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:tallyup}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:tallyup_secret}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

google:
  client-id: ${GOOGLE_CLIENT_ID:1091925699307-hgj64mefa56k4lp3on88ion20l5na64h.apps.googleusercontent.com}

management:
  endpoints:
    web:
      exposure:
        include: health, info
