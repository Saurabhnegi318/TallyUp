<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tallyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#tallyBg)" />

  <!-- Accent Card sliding up ("Tally Up") -->
  <rect x="136" y="112" width="240" height="150" rx="20" fill="url(#cardGrad)" opacity="0.9" />
  <!-- Card stripe -->
  <rect x="136" y="152" width="240" height="28" fill="#0d9488" opacity="0.35" />

  <!-- Main Wallet Body with shadow -->
  <g filter="url(#dropShadow)">
    <rect x="96" y="180" width="320" height="230" rx="36" fill="#ffffff" />
    <!-- Wallet Flap / Pocket curve -->
    <path d="M 96,250 C 160,280 352,280 416,250 L 416,374 C 416,394 400,410 380,410 L 132,410 C 112,410 96,394 96,374 Z" fill="#f0fdf4" />
    <!-- Wallet Clasp -->
    <rect x="330" y="270" width="76" height="52" rx="16" fill="url(#tallyBg)" />
    <!-- Clasp Button -->
    <circle cx="368" cy="296" r="10" fill="#ffffff" />
    
    <!-- Tally marks on wallet (representing split tracking) -->
    <line x1="150" y1="315" x2="150" y2="365" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="174" y1="315" x2="174" y2="365" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="198" y1="315" x2="198" y2="365" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="222" y1="315" x2="222" y2="365" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="138" y1="355" x2="234" y2="325" stroke="#059669" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
